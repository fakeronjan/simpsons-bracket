<script>
(function() {
  // Board is a fixed 2180x2370 canvas. On a viewport wider than
  // that, scale it up to fill the extra width instead of sitting pinned
  // to a small box with padding on both sides - a real friend's
  // 3840px-wide desktop browser hit exactly this (reported 2026-09-20).
  // Never scales down; narrow screens keep today's horizontal-scroll
  // behavior unchanged.
  var BOARD_W = 2180, BOARD_H = 2370;
  var wrap = document.getElementById('boardWrap');
  var board = document.getElementById('board');
  function resize() {
    var scale = Math.max(1, window.innerWidth / BOARD_W);
    board.style.transform = 'scale(' + scale + ')';
    var h = Math.round(BOARD_H * scale);
    wrap.style.height = h + 'px';
    // fakeronjan.com embeds this page in a fixed-height iframe (see
    // sports-pages.njk's resize listener convention) - without this, a
    // scaled-up board would be clipped/scroll inside that fixed height.
    if (window.parent !== window) {
      window.parent.postMessage({type: 'fakeronjan-resize', height: h}, '*');
    }
  }
  resize();
  window.addEventListener('resize', resize);
})();
</script>
